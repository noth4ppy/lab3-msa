# Test configuration: separate in-memory H2 database, the working database "books" is not touched.
# This file shadows src/main/resources/application.properties on the test classpath.
spring.application.name=lab1-test

spring.datasource.url=jdbc:h2:mem:books_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# schema is created at context start and dropped at shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# data.sql (authors id=1, 2 and book id=1) runs after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=false
