spring.application.name=lab1
server.port=8081

# Local run (mvn spring-boot:run): in-memory H2.
# In Docker these values are overridden by environment variables
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# (jdbc:mysql://mysql:3306/books); the driver and dialect are detected from the URL.
spring.datasource.url=jdbc:h2:mem:books;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# data.sql runs after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true
# run data.sql for non-embedded databases too (MySQL); the script is idempotent
spring.sql.init.mode=always

# H2 console (local run only; disabled in Docker via SPRING_H2_CONSOLE_ENABLED=false)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
